<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Your Free Insurance Quote</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="form-header">
                <div class="logo">
                    <i class="fas fa-shield-alt"></i>
                    <span>InsurePro</span>
                </div>
                <h1>Get Your Free Insurance Quote</h1>
                <p>Complete the form below to compare rates from top insurance providers</p>
            </div>
            
            <form id="insuranceForm" class="insurance-form">
                <div class="form-section">
                    <h2>Personal Information</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="first_name">First Name*</label>
                            <input type="text" id="first_name" name="first_name" required>
                        </div>
                        <div class="form-group">
                            <label for="last_name">Last Name*</label>
                            <input type="text" id="last_name" name="last_name" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address*</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Phone Number*</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="address">Street Address*</label>
                        <input type="text" id="address" name="address" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City*</label>
                            <input type="text" id="city" name="city" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="state">State*</label>
                            <select id="state" name="state" required>
                                <option value="">Select State</option>
                                <option value="CA">California</option>
                                <option value="TX">Texas</option>
                                <option value="FL">Florida</option>
                                <!-- Other states would be here -->
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="zip">ZIP Code*</label>
                            <input type="text" id="zip" name="zip" required pattern="\d{5}(-\d{4})?" title="Please enter a valid ZIP code">
                        </div>
                    </div>
                </div>
                
                <div class="form-section">
                    <h2>Insurance Information</h2>
                    <div class="form-group">
                        <label for="insurance_type">Type of Insurance*</label>
                        <select id="insurance_type" name="insurance_type" required>
                            <option value="">Select Insurance Type</option>
                            <option value="auto">Auto Insurance</option>
                            <option value="home">Homeowners Insurance</option>
                            <option value="health">Health Insurance</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="coverage_amount">Desired Coverage Amount*</label>
                        <select id="coverage_amount" name="coverage_amount" required>
                            <option value="">Select Coverage Amount</option>
                            <option value="50000">$50,000</option>
                            <option value="100000">$100,000</option>
                            <option value="250000">$250,000</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-section">
                    <div class="form-group terms">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">
                            I agree to the <a href="#" target="_blank">Terms of Service</a> and <a href="#" target="_blank">Privacy Policy</a>.
                        </label>
                    </div>
                    
                    <div class="form-group">
                        <input type="hidden" id="lp_campaign_id" name="lp_campaign_id" value="19">
                        <button type="submit" class="submit-btn">Get My Free Quotes</button>
                    </div>
                </div>
            </form>
            
            <div id="thankYouMessage" class="thank-you-message" style="display: none;">
                <div class="success-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h2>Thank You!</h2>
                <p>Your information has been received. A licensed insurance agent will contact you shortly.</p>
                <button id="newQuoteBtn" class="btn-secondary">Start New Quote</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
