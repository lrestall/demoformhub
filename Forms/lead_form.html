<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Submission Form</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; margin-bottom: 10px; }
        .required:after { content: " *"; color: red; }
        button { background: #007bff; color: white; border: none; padding: 10px; cursor: pointer; width: 100%; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>Lead Submission Form</h1>
    <form id="leadForm" action="https://leads.leadspediatrack.com/post.do" method="POST">
        <!-- Hidden Fields -->
        <input type="hidden" name="campaign_id" value="19">
        <input type="hidden" name="lp_campaign_id" value="19">
        <input type="hidden" name="lp_response" value="json">
        
        <!-- Contact Information -->
        <div class="form-group">
            <label for="first_name" class="required">First Name</label>
            <input type="text" id="first_name" name="first_name" required>
        </div>
        
        <div class="form-group">
            <label for="last_name" class="required">Last Name</label>
            <input type="text" id="last_name" name="last_name" required>
        </div>
        
        <div class="form-group">
            <label for="email" class="required">Email Address</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label for="phone1" class="required">Phone Number</label>
            <input type="tel" id="phone1" name="phone1" required>
        </div>
        
        <!-- Address -->
        <div class="form-group">
            <label for="address" class="required">Street Address</label>
            <input type="text" id="address" name="address" required>
        </div>
        
        <div class="form-group">
            <label for="city" class="required">City</label>
            <input type="text" id="city" name="city" required>
        </div>
        
        <div class="form-group">
            <label for="state" class="required">State</label>
            <select id="state" name="state" required>
                <option value="">Select State</option>
                <option value="AL">Alabama</option>
                <option value="AK">Alaska</option>
                <!-- More states would go here -->
            </select>
        </div>
        
        <div class="form-group">
            <label for="zip" class="required">ZIP Code</label>
            <input type="text" id="zip" name="zip" required>
        </div>
        
        <!-- Loan Information -->
        <div class="form-group">
            <label for="loan_amount" class="required">Loan Amount Requested ($)</label>
            <input type="number" id="loan_amount" name="loan_amount" required>
        </div>
        
        <!-- TCPA Compliance -->
        <div class="form-group">
            <input type="checkbox" id="tcpa_consent" name="tcpa_consent" required>
            <label for="tcpa_consent" style="display: inline; font-weight: normal;">
                I consent to receive calls, texts, and emails regarding products or services.
            </label>
        </div>
        
        <button type="submit">Submit Application</button>
    </form>
    
    <script>
        document.getElementById('leadForm').addEventListener('submit', function(e) {
            console.log('Form submitted');
            // Form validation can be added here
        });
    </script>
</body>
</html>
