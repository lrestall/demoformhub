<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Loan Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --error: #ef4444;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-700: #374151;
            --white: #ffffff;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            line-height: 1.5;
            color: var(--gray-700);
            background-color: #f9fafb;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            margin: 2rem auto;
        }
        
        .card {
            background: var(--white);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2rem;
            margin-bottom: 1.5rem;
        }
        
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 0.5rem;
        }
        
        .header p {
            color: #6b7280;
            font-size: 0.9375rem;
        }
        
        .form-group {
            margin-bottom: 1.25rem;
        }
        
        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #4b5563;
        }
        
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.9375rem;
            border: 1px solid var(--gray-200);
            border-radius: 0.5rem;
            transition: all 0.2s;
            background-color: var(--white);
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        
        .form-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }
        
        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.875rem 1.5rem;
            font-size: 0.9375rem;
            font-weight: 500;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }
        
        .btn i {
            margin-right: 0.5rem;
        }
        
        .loan-amount {
            margin-bottom: 1.5rem;
        }
        
        .amount-slider {
            width: 100%;
            margin: 1rem 0;
            -webkit-appearance: none;
            height: 6px;
            border-radius: 3px;
            background: var(--gray-200);
            outline: none;
        }
        
        .amount-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .amount-slider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.2);
        }
        
        .amount-display {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-align: center;
            margin: 0.5rem 0;
        }
        
        .amount-range {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #6b7280;
        }
        
        .tcpa-consent {
            font-size: 0.75rem;
            color: #6b7280;
            margin: 1.5rem 0;
            line-height: 1.5;
        }
        
        .tcpa-consent input[type="checkbox"] {
            margin-right: 0.5rem;
        }
        
        .benefits {
            display: flex;
            gap: 1rem;
            margin: 1.5rem 0;
            font-size: 0.8125rem;
        }
        
        .benefit {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #4b5563;
        }
        
        .benefit i {
            color: var(--primary);
            font-size: 1rem;
        }
        
        @media (max-width: 480px) {
            .form-row {
                flex-direction: column;
                gap: 1.25rem;
            }
            
            .card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <form id="loanForm" action="https://leads.leadspediatrack.com/post.do" method="POST">
            <!-- Hidden Fields -->
            <input type="hidden" name="campaign_id" value="19">
            <input type="hidden" name="lp_campaign_id" value="19">
            <input type="hidden" name="lp_response" value="json">
            
            <div class="card">
                <div class="header">
                    <h1>Get Your Loan</h1>
                    <p>Complete your application in under 2 minutes</p>
                </div>
                
                <!-- Loan Amount -->
                <div class="form-group loan-amount">
                    <label for="loan_amount">How much do you need?</label>
                    <div class="amount-display">$<span id="amountDisplay">5,000</span></div>
                    <input type="range" id="loan_amount" name="loan_amount" min="1000" max="50000" step="100" value="5000" class="amount-slider">
                    <div class="amount-range">
                        <span>$1,000</span>
                        <span>$50,000+</span>
                    </div>
                </div>
                
                <!-- Personal Information -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name" class="form-control" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="phone1">Phone</label>
                    <input type="tel" id="phone1" name="phone1" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" class="form-control" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" name="city" class="form-control" required>
                    </div>
                    <div class="form-group" style="flex: 0.7;">
                        <label for="state">State</label>
                        <select id="state" name="state" class="form-control" required>
                            <option value="">Select</option>
                            <option value="AL">AL</option>
                            <option value="AK">AK</option>
                            <option value="AZ">AZ</option>
                            <option value="AR">AR</option>
                            <option value="CA">CA</option>
                            <option value="CO">CO</option>
                            <option value="CT">CT</option>
                            <option value="DE">DE</option>
                            <option value="FL">FL</option>
                            <option value="GA">GA</option>
                            <option value="HI">HI</option>
                            <option value="ID">ID</option>
                            <option value="IL">IL</option>
                            <option value="IN">IN</option>
                            <option value="IA">IA</option>
                            <option value="KS">KS</option>
                            <option value="KY">KY</option>
                            <option value="LA">LA</option>
                            <option value="ME">ME</option>
                            <option value="MD">MD</option>
                            <option value="MA">MA</option>
                            <option value="MI">MI</option>
                            <option value="MN">MN</option>
                            <option value="MS">MS</option>
                            <option value="MO">MO</option>
                            <option value="MT">MT</option>
                            <option value="NE">NE</option>
                            <option value="NV">NV</option>
                            <option value="NH">NH</option>
                            <option value="NJ">NJ</option>
                            <option value="NM">NM</option>
                            <option value="NY">NY</option>
                            <option value="NC">NC</option>
                            <option value="ND">ND</option>
                            <option value="OH">OH</option>
                            <option value="OK">OK</option>
                            <option value="OR">OR</option>
                            <option value="PA">PA</option>
                            <option value="RI">RI</option>
                            <option value="SC">SC</option>
                            <option value="SD">SD</option>
                            <option value="TN">TN</option>
                            <option value="TX">TX</option>
                            <option value="UT">UT</option>
                            <option value="VT">VT</option>
                            <option value="VA">VA</option>
                            <option value="WA">WA</option>
                            <option value="WV">WV</option>
                            <option value="WI">WI</option>
                            <option value="WY">WY</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 0.8;">
                        <label for="zip">ZIP</label>
                        <input type="text" id="zip" name="zip" class="form-control" required>
                    </div>
                </div>
                
                <!-- Quick Benefits -->
                <div class="benefits">
                    <div class="benefit">
                        <i class="fas fa-shield-alt"></i>
                        <span>Secure</span>
                    </div>
                    <div class="benefit">
                        <i class="fas fa-bolt"></i>
                        <span>Fast</span>
                    </div>
                    <div class="benefit">
                        <i class="fas fa-check-circle"></i>
                        <span>Easy</span>
                    </div>
                </div>
                
                <!-- TCPA Compliance -->
                <div class="tcpa-consent">
                    <input type="checkbox" id="tcpa_consent" name="tcpa_consent" required>
                    <label for="tcpa_consent">
                        I agree to receive calls/texts, including by automated means, from our partners and us about products/services. Message/data rates may apply.
                    </label>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i> Get Started
                </button>
            </div>
        </form>
    </div>
    
    <script>
        // Update loan amount display
        const loanAmountSlider = document.getElementById('loan_amount');
        const amountDisplay = document.getElementById('amountDisplay');
        
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }
        
        loanAmountSlider.addEventListener('input', function() {
            amountDisplay.textContent = formatNumber(this.value);
        });
        
        // Format initial display value
        amountDisplay.textContent = formatNumber(loanAmountSlider.value);
        
        // Add smooth focus states
        const inputs = document.querySelectorAll('.form-control');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('focused');
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.classList.remove('focused');
            });
        });
    </script>
</body>
</html>
